name: Construir APK

on:
  push:
    branches: [main, prueba]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Probar y construir el APK
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Preparar el archivo
        run: cp app/build/outputs/apk/release/app-release.apk BestKeyboard.apk

      - name: Publicar en el enlace fijo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then TAG=ultima-version; EXTRA=""; else TAG=prueba; EXTRA="--prerelease"; fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          sleep 3
          gh release create "$TAG" BestKeyboard.apk $EXTRA \
            --title "Best Keyboard - ${TAG} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Construido automáticamente. Descarga BestKeyboard.apk e instálalo encima del anterior." \
            --target "${GITHUB_SHA}"
          if [ -f app/build/reporte-pruebas.txt ]; then gh release upload "$TAG" app/build/reporte-pruebas.txt --clobber; fi

      - name: Publicar el registro de errores (si falló)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete registro-error --yes --cleanup-tag || true
          sleep 2
          tail -c 200000 build.log > registro-error.txt || echo "sin registro" > registro-error.txt
          gh release create registro-error registro-error.txt --title "Registro de error" --notes "Error de construcción" --target "${GITHUB_SHA}" --prerelease
