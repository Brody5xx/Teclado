name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construir el APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar el archivo
        run: cp app/build/outputs/apk/release/app-release.apk BestKeyboard.apk

      - name: Publicar en el enlace fijo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          sleep 3
          gh release create ultima-version BestKeyboard.apk \
            --title "Best Keyboard - última versión (build ${GITHUB_RUN_NUMBER})" \
            --notes "Construido automáticamente. Descarga BestKeyboard.apk e instálalo encima del anterior." \
            --target "${GITHUB_SHA}"
